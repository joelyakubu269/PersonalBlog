<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin page</title>
</head>
<body>
    {{range .}}
    <article>
    <p>{{.Title}}</p>
    <p>{{.Author}}</p>
    <p>{{.Summary}}</p>
    <a href="/article?={.ID}">Read Article</a>
    <a href="/admin/article/edit?={.ID}">Edit</a>
    <a href="/admin/article?/delete={.ID}">Delete</a>
    </article>
    
</body>
</html>
