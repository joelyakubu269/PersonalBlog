<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog</title>
</head>
<h1> Welcome to my blog where I share my
 thoughts, experiences, and ideas</h1>
<body>
    <h2>Articles</h2>
    {{range .}}
    <article>
    <p>{{.Title}}</p>
    <p>{{.Author}}</p>
    <p>{{.Summary}}</p>
    <a href="/article?={.ID}">Read Article</a>
    </article>
    {{end}}
</body>
</html>
